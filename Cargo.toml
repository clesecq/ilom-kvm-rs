[workspace]
resolver = "3"
members = ["crates/ilom-kvm-core", "crates/ilom-kvm", "crates/ilom-vnc", "crates/ilom-mcp"]
default-members = ["crates/ilom-kvm"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ilom-kvm-core = { path = "crates/ilom-kvm-core" }
ilom-vnc = { path = "crates/ilom-vnc" }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "6"
dotenvy = "0.15.7"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[patch.crates-io]
egui-winit = { path = "third_party/egui-winit" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
