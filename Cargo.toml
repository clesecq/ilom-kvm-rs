[workspace]
resolver = "3"
members = ["crates/ilom-kvm-core", "crates/ilom-kvm", "crates/ilom-vnc"]
default-members = ["crates/ilom-kvm"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ilom-kvm-core = { path = "crates/ilom-kvm-core" }
anyhow = "1.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7"
dotenvy = "0.15.7"
hex = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[patch.crates-io]
egui-winit = { path = "third_party/egui-winit" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
