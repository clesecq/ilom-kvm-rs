[package]
name = "ilom-kvm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Java-free native client for the Oracle ILOM Remote System Console"

[dependencies]
aes = "0.9"
anyhow = "1.0"
arboard = { version = "3", features = ["wayland-data-control"] }
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
eframe = "0.36.2"
rfd = "0.17"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
md-5 = { version = "0.11.0", default-features = false }
native-tls = "0.2.18"
pwhash = { version = "1.0.0", default-features = false }
roxmltree = "0.21.1"
sha2 = "0.11.0"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasmi = "2.0"

[patch.crates-io]
egui-winit = { path = "third_party/egui-winit" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
