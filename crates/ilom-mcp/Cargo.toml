[package]
name = "ilom-mcp"
description = "MCP server (stdio) letting an LLM agent drive the Oracle ILOM Remote System Console"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# OCR for the read_screen tool; pure Rust, needs model files at run time.
ocr = ["dep:ocrs", "dep:rten"]

[dependencies]
ilom-kvm-core.workspace = true
ilom-vnc.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dotenvy.workspace = true
image.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ocrs = { workspace = true, optional = true }
rten = { workspace = true, optional = true }
