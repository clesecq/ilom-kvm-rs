name: Install Linux dependencies
description: Install OpenSSL and GUI development packages needed to build ilom-kvm on Ubuntu.
runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libgtk-3-dev \
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxkbcommon-dev libwayland-dev
