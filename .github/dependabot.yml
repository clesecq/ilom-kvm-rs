version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # RustCrypto crates share the cipher/digest traits and must move together.
      rustcrypto:
        patterns: [aes, cbc, cipher, des, md-5, sha2]
      cargo-minor:
        update-types: [minor, patch]
